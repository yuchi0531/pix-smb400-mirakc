# J:COM 関東 + BS/CS（トラモジ）の channels 例
#
# mirakc は config.yml の channels しか読まないため、このファイルは参照用です。
# 実際に使う場合は config.yml の channels: にマージしてください。
# GR/BS/CS/BS4K: 衛星波、CATV: トラモジ含む。すべて独立チャンネル（routes なし）。

channels:
  # Mirakurun (192.168.100.111) の channels.yml から変換
  #   scripts/import_mirakurun_channels.py / 元データ: tmp/channels-111/api-channels.json
  # channel 値の解釈は smb400-tuner.sh が行う。復号はすべて同スクリプト内で完了する。
  # --- GR (ISDB-T 地上波) ---
  # channel = 物理チャンネル番号 (13-62)。services は .111 の実測 SDT 由来。
