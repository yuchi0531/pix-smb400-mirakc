# SMB400 mirakc configuration — GR / BS / CS / BS4K (BS8K含む)
#
# 1台の物理チューナーが GR / BS / CS / BS4K を兼用する。channel 値の解釈は
# smb400-tuner.sh が行う:
#   GR   = 物理チャンネル番号 (13-62)
#   BS   = BSxx_y (xx=トランスポンダ番号, y=相対TS)
#   CS   = NDxx  (xx=偶数トランスポンダ番号)
#   BS4K = 5桁 StreamID (45168 など。BS8K の 45280 も同じ経路)
# 復号はすべて smb400-tuner.sh 内で完了する:
#   GR / BS / CS(2K) は b21dec (MULTI2 / ACAS 従来CAS) で平文 MPEG-TS を出力。
#   BS4K / BS8K は b61dec (ISDB-S3 / AES) で復号済み TLV を出力し、mirakc は
#   これを passthrough する。
#
# channels[].services は SDT 上の実サービスID (serviceId)。
#   - GR / BS / CS(2K) は標準のサービススキャンが効くため services を省略できる
#     (省略時は検出した全サービスを登録)。
#   - BS4K はサービススキャン対象外のため services の明示が必須。

epg:
  cache-dir: /data/local/tmp/mirakc/epg

server:
  addrs:
    - http: '0.0.0.0:40772'

resource:
  strings-yaml: /data/local/tmp/mirakc/strings.yml

channels:
  # --- GR (ISDB-T 地上波) ---
  # 地デジも MULTI2(B-CAS) スクランブルのため smb400-tuner.sh 内の b21dec で解除する。
  # channel = 物理チャンネル番号(13-62)。IF = 473143 + (ch-13)*6000 kHz。
  # 【重要】物理チャンネル割り当ては地域で異なる。以下は関東(東京)の例。お住まいの
  #         地域に合わせて channel 番号を変更すること。services は省略し、
  #         サービススキャンに各局の自動登録を任せる。
  # ※ 本機は衛星のみで未検証。地上波アンテナ接続後、チップが地デジ EMM で Kw を取得
  #    すれば復号可能（一度も地上波を受信していないと当初は視聴不可になり得る）。
  - name: 'NHK総合'
    type: GR
    channel: '27'
  - name: 'NHK Eテレ'
    type: GR
    channel: '26'
  - name: '日テレ'
    type: GR
    channel: '25'
  - name: 'テレビ朝日'
    type: GR
    channel: '24'
  - name: 'TBS'
    type: GR
    channel: '22'
  - name: 'テレビ東京'
    type: GR
    channel: '23'
  - name: 'フジテレビ'
    type: GR
    channel: '21'
  - name: 'TOKYO MX'
    type: GR
    channel: '16'

  # --- BS4K (ISDB-S3, 衛星4K) ---
  # b61dec が復号済み TLV を出力し、mirakc は passthrough する。services には
  # 実サービスID(SDT 由来)を明示する。
  - name: 'BS4K 45168'
    type: BS4K
    channel: '45168'
    services: [151]
  - name: 'BS4K 45169'
    type: BS4K
    channel: '45169'
    services: [171]
  - name: 'BS4K 45170'
    type: BS4K
    channel: '45170'
    services: [141]
  - name: 'BS4K 45232'
    type: BS4K
    channel: '45232'
    services: [211]
  - name: 'BS4K 45234'
    type: BS4K
    channel: '45234'
    services: [221]
  - name: 'BS4K 45328'
    type: BS4K
    channel: '45328'
    services: [101]
  - name: 'BS4K 45329'
    type: BS4K
    channel: '45329'
    services: [161]
  - name: 'BS4K 45330'
    type: BS4K
    channel: '45330'
    services: [181]
  # --- BS8K (ISDB-S3, 衛星8K, 左旋) ---
  # NHK BS8K。種別は BS4K に混在（同じ ISDB-S3 経路）。channel は実 tlvStreamId=45280
  # （左旋。右旋IFでは受からず以前 "signal absent" として除外されていた値）。
  # smb400-tuner.sh が 45280 を IF 2472MHz にマップする。
  # ※ channel 45745 は本機で信号が受からないため定義しない。
  - name: 'BS8K NHK'
    type: BS4K
    channel: '45280'
    services: [102]

  # --- BS (ISDB-S, 従来2K衛星, 右旋) ---
  # MULTI2 スクランブルを smb400-tuner.sh 内の b21dec が ACAS チップ経由で解除し、
  # 平文 MPEG-TS を出力（mirakc の service-filter / program-filter で処理）。
  # channel=BSxx_y（xx=トランスポンダ番号, _y=相対TS）。IF は xx から、実 TS-ID は
  # smb400-tuner.sh の TS-ID 表（実機 NIT 由来）で解決して tunertest に渡す。
  #
  # 一覧は実機 NIT/SDT スキャン（2026-06-21, 右旋 BS01〜BS23）で全相対 TS を確認した結果。
  # 各局の ECM を ACAS チップへ投げて復号可否(rc)も確認済み:
  #   * BS07/11/17 は BS4K(ISDB-S3/TLV) 専用のため 2K では受からない。
  #   * 無料局(rc=0x0800)は本機で復号可。有料局(rc=0xa103)は本機未契約のため復号不可
  #     （契約のある ACAS チップなら b21dec で復号できる。参考として末尾にコメントで残置）。
  #
  # 無料局（本機で復号確認済み rc=0x0800）
  - name: 'BS朝日'
    type: BS
    channel: 'BS01_0'
    services: [151, 152, 153]
  - name: 'BS-TBS'
    type: BS
    channel: 'BS01_1'
    services: [161, 162, 163]
  - name: 'BSテレ東'
    type: BS
    channel: 'BS01_2'
    services: [171, 172, 173]
  - name: 'BS11イレブン'
    type: BS
    channel: 'BS09_0'
    services: [211]
  - name: 'BS12トゥエルビ'
    type: BS
    channel: 'BS09_2'
    services: [222]
  - name: 'BS日テレ'
    type: BS
    channel: 'BS13_0'
    services: [141, 142, 143]
  - name: 'BSフジ'
    type: BS
    channel: 'BS13_1'
    services: [181, 182, 183]
  - name: '放送大学'
    type: BS
    channel: 'BS13_2'
    services: [231, 232]
  - name: 'NHK BS'
    type: BS
    channel: 'BS15_0'
    services: [101, 102]
  - name: 'BS10'
    type: BS
    channel: 'BS15_2'
    services: [200]
  - name: 'BSよしもと'
    type: BS
    channel: 'BS23_1'
    services: [265]
  - name: 'J:COM BS'
    type: BS
    channel: 'BS23_3'
    services: [260]

  # --- CS (110度CS, ISDB-S 2K相当) ---
  # MULTI2 スクランブルを smb400-tuner.sh 内の b21dec が ACAS チップ経由で解除し、
  # 平文 MPEG-TS を出力（mirakc の service-filter / program-filter で処理）。
  # channel=ND02〜ND24（偶数のみ）。1トランスポンダ=単一TS(MPTS)のため
  # BS のような TSID 表は不要（smb400-tuner.sh が NDxx から IF を直接算出）。
  # services の実測値は hotarun 側 .111 機の実波 SDT 由来（全国共通の固定値）。
  # services なしはサービススキャン用のプレースホルダ（make test-cs が CS/ND02 を叩く）。
  - name: 'CS ND02'
    type: CS
    channel: 'ND02'
  - name: 'CS ND04'
    type: CS
    channel: 'ND04'
  - name: 'CS ND06'
    type: CS
    channel: 'ND06'
  - name: 'CS ND08'
    type: CS
    channel: 'ND08'
  - name: 'CS ND10'
    type: CS
    channel: 'ND10'
  - name: 'CS ND12'
    type: CS
    channel: 'ND12'
  - name: 'CS ND14'
    type: CS
    channel: 'ND14'
  - name: 'CS ND16'
    type: CS
    channel: 'ND16'
  - name: 'CS ND18'
    type: CS
    channel: 'ND18'
  - name: 'CS ND20'
    type: CS
    channel: 'ND20'
  - name: 'CS ND22'
    type: CS
    channel: 'ND22'
  - name: 'CS ND24'
    type: CS
    channel: 'ND24'

  # 有料局（未契約のため無効。契約があれば有効化可）
  # - name: 'テレ朝チャンネル1'
  #   type: CS
  #   channel: 'ND02'
  #   services: [298]
  # - name: 'テレ朝チャンネル2'
  #   type: CS
  #   channel: 'ND02'
  #   services: [299]
  # - name: 'AT-X'
  #   type: CS
  #   channel: 'ND16'
  #   services: [333]
  # - name: '日テレプラス'
  #   type: CS
  #   channel: 'ND24'
  #   services: [300]

  # 有料局（本機は未契約のため rc=0xa103 で復号不可。契約のあるチップなら有効化可）
  # - name: 'WOWOWプライム'
  #   type: BS
  #   channel: 'BS03_0'
  #   services: [191]
  # - name: 'WOWOWライブ'
  #   type: BS
  #   channel: 'BS05_0'
  #   services: [192]
  # - name: 'J SPORTS 4'
  #   type: BS
  #   channel: 'BS19_0'
  #   services: [245]
  # - name: 'WOWOWプラス'
  #   type: BS
  #   channel: 'BS21_0'
  #   services: [252]
  # - name: 'ディズニーch'
  #   type: BS
  #   channel: 'BS23_0'
  #   services: [256]

tuners:
  # 1台の物理チューナーが GR / BS / CS / BS4K を兼用する。
  # channel 値(GR=物理ch, BS=BSxx_y, CS=NDxx, BS4K=5桁StreamID)は
  # smb400-tuner.sh が解釈する。
  # GR / BS(2K) / CS は復号済み MPEG-TS、BS4K / BS8K は復号済み TLV を出力する。
  # BS4K は mirakc 側で passthrough されるため、tlvDecoder / decode-filter は
  # 不要（下流にスクランブル済みデータを渡すこともない）。
  - name: SMB400
    types: [GR, BS, CS, BS4K]
    command: /data/local/tmp/smb400-tuner.sh {{{channel}}}
    time-limit: 30000

filters:
  # 復号はチューナーコマンド内で完了しているため decode-filter は空のまま
  # （tuner-filter もデフォルトの空のまま）。
  service-filter:
    command: '/data/local/tmp/mirakc/bin/mirakc-arib filter-service --sid={{{sid}}}'
  program-filter:
    command: '/data/local/tmp/mirakc/bin/mirakc-arib filter-program --sid={{{sid}}} --eid={{{eid}}} --clock-pid={{{clock_pid}}} --clock-pcr={{{clock_pcr}}} --clock-time={{{clock_time}}} --end-margin=2000{{#video_tags}} --video-tag={{{.}}}{{/video_tags}}{{#audio_tags}} --audio-tag={{{.}}}{{/audio_tags}}{{#wait_until}} --wait-until={{{.}}}{{/wait_until}}'

jobs:
  scan-services:
    command: '/data/local/tmp/mirakc/bin/mirakc-arib scan-services{{#sids}} --sids={{{.}}}{{/sids}}{{#xsids}} --xsids={{{.}}}{{/xsids}}'
    command-bs4k: '/data/local/tmp/mirakc/bin/mirakc-arib-tlv scan-services-tlv{{#sids}} --sids={{{.}}}{{/sids}}{{#xsids}} --xsids={{{.}}}{{/xsids}}'
    # 08:01 と 20:01 に実行 (デフォルト)
    schedule: '0 1 8,20 * * * *'
    timeout: 30s
  sync-clocks:
    command: '/data/local/tmp/mirakc/bin/mirakc-arib sync-clocks{{#sids}} --sids={{{.}}}{{/sids}}{{#xsids}} --xsids={{{.}}}{{/xsids}}'
    # 08:11 と 20:11 に実行 (デフォルト)
    schedule: '0 11 8,20 * * * *'
    timeout: 30s
  update-schedules:
    command: '/data/local/tmp/mirakc/bin/mirakc-arib collect-eits{{#sids}} --sids={{{.}}}{{/sids}}{{#xsids}} --xsids={{{.}}}{{/xsids}}'
    command-bs4k: '/data/local/tmp/mirakc/bin/mirakc-arib-tlv collect-mh-eits --time-limit=90{{#sids}} --sids={{{.}}}{{/sids}}{{#xsids}} --xsids={{{.}}}{{/xsids}}'
    # 08:21 と 20:21 に実行 (デフォルト)
    schedule: '0 21 8,20 * * * *'
    timeout: 10m

# タイムシフト不使用のため検証通過用ダミー（recorders が空のため実行されない）
timeshift:
  command: /bin/cat

# recording は使用しない（録画は EPGStation 等のクライアント側で行う）ため省略。
