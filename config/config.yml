    channel: "C56"
    services: []
    routes:
      - tuner: SMB400
  - name: "ザ・シネマHD（CATV）"
    type: CATV
    channel: "C57"
    services: [452, 753, 754]
    routes:
      - tuner: SMB400
  - name: "ご案内チャンネル（CATV）"
    type: CATV
    channel: "C58"
    services: [285, 290, 440, 922, 945]
    routes:
      - tuner: SMB400
tuners:
  # 1台の物理チューナーが GR / BS / CS / BS4K を兼用する。
  # channel 値(GR=物理ch, BS=BSxx_y, CS=CSn/NDxx, BS4K=5桁StreamID)は
  # smb400-tuner.sh が解釈する。
  # チューナーコマンドは「生（スクランブル済み）」の MPEG-TS / TLV を出力する。
  # 復号はデコーダ側（b25dec / b61dec、ローカルまたはリモート）が
  # ACAS チップ（必要なら acas_proxy 経由）を使って行う。
  # BS4K は mirakc 側で passthrough される（tlvDecoder / decode-filter は不要）。
  - name: SMB400
    types: [GR, BS, CS, BS4K, CATV]
    command: /data/local/tmp/smb400-tuner.sh {{{channel}}}
    time-limit: 30000

filters:
  # 生ストリームを復号するデコーダ（チャンネル種別で b61dec / b25dec を選択）。
  # ACAS は同じ SMB400 上の acas_proxy を --host 127.0.0.1:40773 で使う。
  tuner-filter:
    command: 'sh -c ''case {{{channel_type}}} in BS4K) exec /data/local/tmp/b61dec -key "$(cat /data/local/tmp/.acas_key)" --host 127.0.0.1:40773 ;; *) exec /data/local/tmp/b25dec --host 127.0.0.1:40773 ;; esac'''
  # tuner-filter で復号済みのため decode-filter は空のまま。
  # TSMF (CATV) 抽出。現状の CATV は tsmf-rel-ts 未使用のため実行されない。
  tsmf-filter:
    command: '/data/local/tmp/mirakc/bin/mirakc-arib filter-tsmf --relative-ts={{{tsmf_rel_ts}}}'
  service-filter:
    command: '/data/local/tmp/mirakc/bin/mirakc-arib filter-service --sid={{{sid}}}'
  program-filter:
    command: '/data/local/tmp/mirakc/bin/mirakc-arib filter-program --sid={{{sid}}} --eid={{{eid}}} --clock-pid={{{clock_pid}}} --clock-pcr={{{clock_pcr}}} --clock-time={{{clock_time}}} --end-margin=2000{{#video_tags}} --video-tag={{{.}}}{{/video_tags}}{{#audio_tags}} --audio-tag={{{.}}}{{/audio_tags}}{{#wait_until}} --wait-until={{{.}}}{{/wait_until}}'

jobs:
  scan-services:
    command: '/data/local/tmp/mirakc/bin/mirakc-arib scan-services{{#sids}} --sids={{{.}}}{{/sids}}{{#xsids}} --xsids={{{.}}}{{/xsids}}'
    command-bs4k: '/data/local/tmp/mirakc/bin/mirakc-arib-tlv scan-services-tlv{{#sids}} --sids={{{.}}}{{/sids}}{{#xsids}} --xsids={{{.}}}{{/xsids}}'
    # 08:01 と 20:01 に実行 (デフォルト)
    schedule: '0 1 8,20 * * * *'
    timeout: 30s
  sync-clocks:
    command: '/data/local/tmp/mirakc/bin/mirakc-arib sync-clocks{{#sids}} --sids={{{.}}}{{/sids}}{{#xsids}} --xsids={{{.}}}{{/xsids}}'
    # 08:11 と 20:11 に実行 (デフォルト)
    schedule: '0 11 8,20 * * * *'
    timeout: 30s
  update-schedules:
    command: '/data/local/tmp/mirakc/bin/mirakc-arib collect-eits{{#sids}} --sids={{{.}}}{{/sids}}{{#xsids}} --xsids={{{.}}}{{/xsids}}'
    command-bs4k: '/data/local/tmp/mirakc/bin/mirakc-arib-tlv collect-mh-eits --time-limit=90{{#sids}} --sids={{{.}}}{{/sids}}{{#xsids}} --xsids={{{.}}}{{/xsids}}'
    # 08:21 と 20:21 に実行 (デフォルト)
    schedule: '0 21 8,20 * * * *'
    timeout: 10m

# タイムシフト不使用のため検証通過用ダミー（recorders が空のため実行されない）
timeshift:
  command: /bin/cat

# recording は使用しない（録画は EPGStation 等のクライアント側で行う）ため省略。
