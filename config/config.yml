# SMB400 mirakc configuration — GR / BS / CS / BS4K (BS8K含む)
#
# 1台の物理チューナーが GR / BS / CS / BS4K を兼用する。channel 値の解釈は
# smb400-tuner.sh が行う:
#   GR   = 物理チャンネル番号 (13-62)
#   BS   = BSxx_y (xx=トランスポンダ番号, y=相対TS)
#   CS   = NDxx  (xx=偶数トランスポンダ番号)
#   BS4K = 5桁 StreamID (45168 など。BS8K の 45280 も同じ経路)
# 復号はすべて smb400-tuner.sh 内で完了する:
#   GR / BS / CS(2K) は b25dec (MULTI2 / ACAS 従来CAS) で平文 MPEG-TS を出力。
#   BS4K / BS8K は b61dec (ISDB-S3 / AES) で復号済み TLV を出力し、mirakc は
#   これを passthrough する。
#
# channels[].services は SDT 上の実サービスID (serviceId)。
#   - GR / BS / CS(2K) は標準のサービススキャンが効くため services を省略できる
#     (省略時は検出した全サービスを登録)。
#   - BS4K はサービススキャン対象外のため services の明示が必須。

epg:
  cache-dir: /data/local/tmp/mirakc/epg

server:
  addrs:
    - http: '0.0.0.0:40772'
  # mirakc-webui (静的SPA) を /www で配信する。
  # ファイルは make build-webui (ソースからビルド) で生成され、
  # make push-webui / deploy-mirakc で /data/local/tmp/mirakc/www へ配置される。
  # アクセス: http://<device>:40772/www （末尾スラッシュ無し。mirakc の
  # mounts 仕様で /www/ は 404 になる）
  mounts:
    /www:
      path: /data/local/tmp/mirakc/www
      index: index.html

resource:
  strings-yaml: /data/local/tmp/mirakc/strings.yml

channels:
  # Mirakurun (192.168.100.111) の channels.yml から変換
  #   scripts/import_mirakurun_channels.py / 元データ: tmp/channels-111/api-channels.json
  # channel 値の解釈は smb400-tuner.sh が行う。復号は tuner-filter (b25dec / b61dec) が行う。
  # --- GR (ISDB-T 地上波) ---
