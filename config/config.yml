# SMB400 mirakc configuration — GR / BS / CS / BS4K (BS8K含む)
#
# 1台の物理チューナーが GR / BS / CS / BS4K を兼用する。channel 値の解釈は
# smb400-tuner.sh が行う:
#   GR   = 物理チャンネル番号 (13-62)
#   BS   = BSxx_y (xx=トランスポンダ番号, y=相対TS)
#   CS   = NDxx  (xx=偶数トランスポンダ番号)
#   BS4K = 5桁 StreamID (45168 など。BS8K の 45280 も同じ経路)
# 復号はすべて smb400-tuner.sh 内で完了する:
#   GR / BS / CS(2K) は b21dec (MULTI2 / ACAS 従来CAS) で平文 MPEG-TS を出力。
#   BS4K / BS8K は b61dec (ISDB-S3 / AES) で復号済み TLV を出力し、mirakc は
#   これを passthrough する。
#
# channels[].services は SDT 上の実サービスID (serviceId)。
#   - GR / BS / CS(2K) は標準のサービススキャンが効くため services を省略できる
#     (省略時は検出した全サービスを登録)。
#   - BS4K はサービススキャン対象外のため services の明示が必須。

epg:
  cache-dir: /data/local/tmp/mirakc/epg

server:
  addrs:
    - http: '0.0.0.0:40772'

resource:
  strings-yaml: /data/local/tmp/mirakc/strings.yml

